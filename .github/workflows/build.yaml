---
name: Build add-on

on:
  push:
    branches: [main]
    paths:
      - opengym/**
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - opengym/**
      - .github/workflows/build.yaml
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners on purpose: cross-building the frontend under QEMU
          # corrupts esbuild/rollup's platform binaries and breaks `vite build`.
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on metadata
        id: meta
        run: |
          version=$(grep -m1 '^version:' opengym/config.yaml | tr -d '"' | awk '{print $2}')
          {
            echo "version=${version}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hass-opengym-${{ matrix.arch }}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: opengym
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # BUILD_FROM is left at the Dockerfile default (the multi-arch Home
          # Assistant base); everything else mirrors what the Supervisor passes.
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_NAME=openGym
            BUILD_DESCRIPTION=Self-hosted workout planner and gym logger
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
