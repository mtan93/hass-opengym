worker_processes  1;
error_log         /proc/1/fd/2 warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 8m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript image/svg+xml;

    # Home Assistant's Ingress proxy already tells us how the browser reached it; keep those
    # values instead of nginx's own, because that is the origin the API has to expect a passkey
    # to be signed for. Falls back to this server's own view for direct (non-Ingress) access.
    map $http_x_forwarded_proto $opengym_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $opengym_host {
        default $http_x_forwarded_host;
        ""      $http_host;
    }

    upstream opengym_api {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    # Ingress — the Supervisor is the only client allowed to reach this.
    server {
        listen 8099 default_server;

        allow 172.30.32.2;
        deny  all;

        include /etc/nginx/includes/opengym.conf;
    }

    # Direct access — only reachable when 8080/tcp is mapped in the add-on configuration.
    server {
        listen 8080;

        include /etc/nginx/includes/opengym.conf;
    }
}
