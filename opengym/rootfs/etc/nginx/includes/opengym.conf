root  /opt/opengym/www;
index index.html;

# Passkey auth, per-user data and push — openGym's Node API.
location /api/ {
    proxy_pass http://opengym_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $opengym_proto;
    proxy_set_header X-Forwarded-Host $opengym_host;
}

# The app routes on the URL hash, so anything else is the app shell.
location / {
    try_files $uri $uri/ /index.html;
}

# App shell: always revalidate, so an add-on update shows up immediately.
location ~* \.(js|css|json|html)$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

# Exercise images/GIFs never change.
location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}
