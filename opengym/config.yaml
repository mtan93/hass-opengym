---
name: openGym
version: "1.2.4"
slug: opengym
description: >-
  Self-hosted workout planner, gym logger and body-weight tracker with
  passkey sign-in
url: https://github.com/mtan93/hass-opengym/tree/main/opengym
arch:
  - aarch64
  - amd64
# Uncomment once .github/workflows/build.yaml has published the images and both GHCR
# packages are public — installs then pull a prebuilt image instead of building locally.
# image: ghcr.io/mtan93/hass-opengym-{arch}
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:dumbbell
panel_title: openGym
panel_admin: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: >-
    Direct web access, outside Ingress. Only needed if you want to install
    openGym as a PWA or reach it on its own hostname.
options:
  origins: []
  rp_id: ""
  rp_name: openGym
  invite_only: false
  admin_uids: ""
  session_days: 90
  log_level: info
schema:
  origins:
    - str
  rp_id: str?
  rp_name: str
  invite_only: bool
  admin_uids: str?
  session_days: int(1,3650)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
